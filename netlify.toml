[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# JS/CSS bundles are content-hashed by Astro, so a given filename's contents
# never change — safe to cache forever regardless of how any page renders.
# The pages themselves (server-rendered per request, reading MongoDB live —
# see src/lib/catalog.js) are NOT cached here, deliberately: a fresh product
# should be visible on refresh, not stuck behind a stale edge cache.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# The admin panel must never be indexed, whatever a stray link might suggest.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
